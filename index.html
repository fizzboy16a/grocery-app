<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Grocery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans min-h-screen pb-12">
    <div class="w-full max-w-2xl mx-auto p-4 md:p-8 space-y-6">
        
        <!-- App Header Bar -->
        <div class="w-full flex items-center justify-between py-2">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🛒</span>
                <h1 class="text-2xl font-bold tracking-tight text-slate-800">Family Grocery</h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="syncWithCloud()" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-medium text-xs rounded-xl px-3 py-2 transition-all border border-emerald-200">
                    🔄 <span id="status-text">Sync</span>
                </button>
                <button id="reset-btn" onclick="openResetModal()" class="hidden bg-red-50 text-red-600 font-medium text-sm rounded-xl px-4 py-2 hover:bg-red-100 transition-all border border-red-200">
                    Reset List
                </button>
            </div>
        </div>

        <!-- Section 1: Quick Staples Grid Card with Active Search Bar -->
        <div class="w-full p-6 bg-white rounded-3xl shadow-sm border border-slate-200 space-y-4">
            <div class="w-full flex items-center justify-between">
                <h2 class="text-lg font-bold text-slate-800 tracking-tight">Quick Add Staples</h2>
            </div>
            <input type="text" id="search-input" placeholder="Search staples (e.g., milk, chicken)..." 
                class="w-full bg-slate-50 rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-emerald-500"
                oninput="handleSearch(this.value)">
            
            <div id="staples-container" class="grid grid-cols-3 gap-3">
                <!-- Rendered via JS -->
            </div>
        </div>

        <!-- Section 2: Custom Item Card -->
        <div class="w-full p-6 bg-white rounded-3xl shadow-sm border border-slate-200 space-y-4">
            <h2 class="text-lg font-bold text-slate-800 tracking-tight">Add Custom Item</h2>
            <div class="w-full flex gap-3 items-center">
                <input type="text" id="custom-name-input" placeholder="e.g., Avocados" 
                    class="flex-grow bg-slate-50 rounded-xl border border-slate-200 px-3 py-2 text-sm outline-none focus:border-emerald-500">
                <select id="custom-cat-input" class="bg-slate-50 rounded-xl border border-slate-200 px-3 py-2 text-xs outline-none">
                    <option value="Pantry">13. Pantry</option>
                    <option value="Dairy">15. Dairy</option>
                    <option value="Salad & Vegetables">1. Salad & Veg</option>
                    <option value="Meat">12. Meat</option>
                    <option value="Frozen">19. Frozen</option>
                </select>
                <button onclick="addCustomItem()" class="h-10 px-6 bg-slate-900 text-white font-medium rounded-xl hover:bg-slate-800 shadow-sm transition-all text-sm">
                    Add
                </button>
            </div>
        </div>

        <!-- Section 3: Live Route-Sorted List Card -->
        <div class="w-full p-6 bg-white rounded-3xl shadow-sm border border-slate-200 space-y-2">
            <div class="w-full flex items-center justify-between mb-2">
                <h2 class="text-lg font-bold text-slate-800 tracking-tight">Shopping List (Route Order)</h2>
                <span id="timestamp-label" class="text-xs font-medium text-slate-400">Last updated: Never</span>
            </div>
            <div id="list-container" class="space-y-1">
                <!-- Rendered via JS -->
            </div>
        </div>
    </div>

    <!-- Reset Modal -->
    <div id="reset-modal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white p-6 gap-4 items-center rounded-2xl shadow-xl max-w-sm w-full space-y-4 text-center">
            <h3 class="text-lg font-semibold text-slate-800">Clear the entire shopping list?</h3>
            <div class="flex gap-3 justify-center">
                <button onclick="confirmReset()" class="bg-red-500 text-white font-medium rounded-xl hover:bg-red-600 px-4 py-2 text-sm">Yes, Clear</button>
                <button onclick="closeResetModal()" class="bg-slate-100 text-slate-600 font-medium rounded-xl hover:bg-slate-200 px-4 py-2 text-sm">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const STORE_LAYOUT = {
            "Salad & Vegetables": 1, "Bananas": 2, "Health Foods": 3, "Berries": 4,
            "Fresh Produce": 5, "Fish & Seafood": 6, "Household": 7, "Drinks": 8,
            "Bakery": 9, "Snacks": 10, "Coffee & Sugar": 11, "Meat": 12,
            "Pantry": 13, "Grains": 14, "Dairy": 15, "Condiments": 16,
            "Juice": 17, "Cheese & Bacon": 18, "Frozen": 19
        };

        const raw_staples = [
            { name: "Spinach", category: "Salad & Vegetables", emoji: "🥬" },
            { name: "Lettuce", category: "Salad & Vegetables", emoji: "🥗" },
            { name: "Tomatoes", category: "Salad & Vegetables", emoji: "🍅" },
            { name: "Bananas", category: "Bananas", emoji: "🍌" },
            { name: "Pumpkin Seeds", category: "Health Foods", emoji: "🌱" },
            { name: "Blueberries", category: "Berries", emoji: "🫐" },
            { name: "Raspberries", category: "Berries", emoji: "🍇" },
            { name: "Mushrooms", category: "Fresh Produce", emoji: "🍄" },
            { name: "Cucumber", category: "Fresh Produce", emoji: "🥒" },
            { name: "Spring Onion", category: "Fresh Produce", emoji: "🧅" },
            { name: "Garlic", category: "Fresh Produce", emoji: "🧄" },
            { name: "Peppers", category: "Fresh Produce", emoji: "🫑" },
            { name: "Tendersteam Broccoli", category: "Fresh Produce", emoji: "🥦" },
            { name: "Cod", category: "Fish & Seafood", emoji: "🐟" },
            { name: "Salmon", category: "Fish & Seafood", emoji: "🍣" },
            { name: "Tuna", category: "Fish & Seafood", emoji: "🐟" },
            { name: "Comfort Pure", category: "Household", emoji: "🧴" },
            { name: "Bleach", category: "Household", emoji: "🧪" },
            { name: "Bin Liners", category: "Household", emoji: "🗑️" },
            { name: "Squash", category: "Drinks", emoji: "🧃" },
            { name: "Bread", category: "Bakery", emoji: "🍞" },
            { name: "Burger Buns", category: "Bakery", emoji: "🍔" },
            { name: "Soreen", category: "Bakery", emoji: "🍞" },
            { name: "KitKats", category: "Snacks", emoji: "🍫" },
            { name: "Coffee", category: "Coffee & Sugar", emoji: "☕" },
            { name: "Sugar", category: "Coffee & Sugar", emoji: "🧊" },
            { name: "Sweeteners", category: "Coffee & Sugar", emoji: "✨" },
            { name: "Chicken Breast", category: "Meat", emoji: "🍗" },
            { name: "Mince Meat", category: "Meat", emoji: "🥩" },
            { name: "Beef", category: "Meat", emoji: "🥩" },
            { name: "Dolmio Sauce", category: "Pantry", emoji: "🥫" },
            { name: "Pasta", category: "Pantry", emoji: "🍝" },
            { name: "Spanish Grains", category: "Grains", emoji: "🌾" },
            { name: "Milk", category: "Dairy", emoji: "🥛" },
            { name: "Protein Yogurt", category: "Dairy", emoji: " yogurt" },
            { name: "Kefir", category: "Dairy", emoji: "🥛" },
            { name: "Olive Oil", category: "Condiments", emoji: "🫒" },
            { name: "Ketchup", category: "Condiments", emoji: "🍅" },
            { name: "BBQ Sauce", category: "Condiments", emoji: "🍖" },
            { name: "Orange Juice", category: "Juice", emoji: "🍊" },
            { name: "Cheese", category: "Cheese & Bacon", emoji: "🧀" },
            { name: "Bacon", category: "Cheese & Bacon", emoji: "🥓" },
            { name: "Mini Magnums", category: "Frozen", emoji: "🍦" }
        ];

        const staples = [...raw_staples].sort((a, b) => a.name.localeCompare(b.name));
        let shoppingList = JSON.parse(localStorage.getItem('grocery_list') || '[]');
        let lastUpdatedTime = "Never";
        let searchQuery = "";

        const JSONBIN_BIN_ID = "6aac2b8aac6210605ad971e4";
        const JSONBIN_API_KEY = "$2a$10$bmFEK.5E854LAjTQhAUaRe7wL1x9P9NEydEieXqkPP2LWKSGSo8qG";

        function updateTimestamp() {
            const now = new Date();
            lastUpdatedTime = now.toLocaleDateString('en-GB', { month: 'short', day: '2-digit' }) + ' at ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function saveState() {
            localStorage.setItem('grocery_list', JSON.stringify(shoppingList));
            updateTimestamp();
            renderAll();
            autoPushCloud();
        }

        function adjustStapleQtyByName(name, delta) {
            const stapleData = staples.find(s => s.name === name);
            if (!stapleData) return;
            const existing = shoppingList.find(i => i.name.toLowerCase() === stapleData.name.toLowerCase());
            if (existing) {
                existing.quantity += delta;
                if (existing.quantity <= 0) {
                    shoppingList = shoppingList.filter(i => i !== existing);
                }
            } else if (delta > 0) {
                shoppingList.push({
                    name: stapleData.name,
                    category: stapleData.category,
                    emoji: stapleData.emoji || "🛒",
                    quantity: delta,
                    checked: false
                });
            }
            saveState();
        }

        function changeListQtyByIndex(idx, delta) {
            const item = shoppingList[idx];
            if (!item) return;
            item.quantity += delta;
            if (item.quantity < 1) item.quantity = 1;
            saveState();
        }

        function toggleCheckByIndex(idx) {
            const item = shoppingList[idx];
            if (!item) return;
            item.checked = !item.checked;
            saveState();
        }

        function removeItemByIndex(idx) {
            shoppingList.splice(idx, 1);
            saveState();
        }

        function openResetModal() { document.getElementById('reset-modal').classList.remove('hidden'); document.getElementById('reset-modal').classList.add('flex'); }
        function closeResetModal() { document.getElementById('reset-modal').classList.add('hidden'); document.getElementById('reset-modal').classList.remove('flex'); }
        function confirmReset() {
            shoppingList = [];
            lastUpdatedTime = "Never";
            closeResetModal();
            saveState();
        }

        function handleSearch(val) {
            searchQuery = val.toLowerCase();
            renderStaplesGrid();
        }

        function addCustomItem() {
            const input = document.getElementById('custom-name-input');
            const cat = document.getElementById('custom-cat-input').value;
            if (!input.value.trim()) return;
            const customName = input.value.trim();
            const existing = shoppingList.find(i => i.name.toLowerCase() === customName.toLowerCase());
            if (existing) {
                existing.quantity += 1;
            } else {
                shoppingList.push({ name: customName, category: cat, emoji: "📦", quantity: 1, checked: false });
            }
            input.value = '';
            saveState();
        }

        function renderStaplesGrid() {
            const container = document.getElementById('staples-container');
            const filtered = staples.filter(s => s.name.toLowerCase().includes(searchQuery));
            if (!filtered.length) {
                container.innerHTML = '<div class="text-slate-400 italic text-center col-span-3 py-6 text-sm">No staples match your search.</div>';
                return;
            }
            const safeName = (n) => n.replace(/'/g, "\\'");
            container.innerHTML = filtered.map(staple => {
                const existing = shoppingList.find(i => i.name.toLowerCase() === staple.name.toLowerCase());
                const qty = existing ? existing.quantity : 0;
                const escaped = safeName(staple.name);
                return `
                    <div class="p-3 flex flex-col items-center justify-between rounded-2xl transition-all border select-none text-center h-36 bg-white border-slate-200 shadow-sm hover:border-emerald-500">
                        <div class="items-center justify-center gap-1 cursor-pointer w-full flex-grow flex flex-col" onclick="adjustStapleQtyByName('${escaped}', 1)">
                            <span class="text-2xl">${staple.emoji}</span>
                            <span class="text-xs font-medium text-slate-700 leading-tight">${staple.name}</span>
                        </div>
                        <div class="w-full flex items-center justify-center gap-1 bg-slate-50 rounded-xl py-1 border border-slate-100">
                            <button onclick="event.stopPropagation(); adjustStapleQtyByName('${escaped}', -1)" class="w-7 h-7 flex items-center justify-center rounded text-slate-500 hover:bg-slate-200 font-bold">−</button>
                            <span class="text-xs font-bold text-slate-700 w-4 text-center">${qty}</span>
                            <button onclick="event.stopPropagation(); adjustStapleQtyByName('${escaped}', 1)" class="w-7 h-7 flex items-center justify-center rounded text-slate-500 hover:bg-slate-200 font-bold">+</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderListDisplay() {
            const container = document.getElementById('list-container');
            document.getElementById('timestamp-label').innerText = `Last updated: ${lastUpdatedTime}`;
            document.getElementById('reset-btn').classList.toggle('hidden', shoppingList.length === 0);

            const sortedList = [...shoppingList].sort((a, b) => (STORE_LAYOUT[a.category] ?? 99) - (STORE_LAYOUT[b.category] ?? 99));

            if (!sortedList.length) {
                container.innerHTML = '<div class="text-slate-400 italic text-center py-6 w-full text-sm">No items added yet. Tap items above!</div>';
                return;
            }

            container.innerHTML = sortedList.map((item) => {
                const realIdx = shoppingList.indexOf(item);
                const routeNum = STORE_LAYOUT[item.category] || '??';
                const rowClasses = item.checked ? 'bg-slate-100 border-slate-200 opacity-50' : 'bg-slate-50 border-slate-100';
                const labelClasses = item.checked ? 'text-slate-400 line-through' : 'text-slate-700';
                return `
                    <div class="w-full items-center justify-between border px-4 py-3 rounded-xl shadow-sm mb-2 transition-all flex ${rowClasses}">
                        <div class="items-center gap-3 flex-grow cursor-pointer select-none flex" onclick="toggleCheckByIndex(${realIdx})">
                            <span class="text-lg">${item.emoji || '🛒'}</span>
                            <div>
                                <div class="text-base font-medium ${labelClasses}">${item.name}</div>
                                <div class="text-[11px] text-slate-400">Route #${routeNum} • ${item.category}</div>
                            </div>
                        </div>
                        <div class="items-center gap-1 flex">
                            <button onclick="event.stopPropagation(); changeListQtyByIndex(${realIdx}, -1)" class="w-7 h-7 flex items-center justify-center rounded text-slate-500 hover:bg-slate-200 font-bold text-sm">−</button>
                            <span class="text-sm font-semibold w-5 text-center">${item.quantity}</span>
                            <button onclick="event.stopPropagation(); changeListQtyByIndex(${realIdx}, 1)" class="w-7 h-7 flex items-center justify-center rounded text-slate-500 hover:bg-slate-200 font-bold text-sm">+</button>
                            <button onclick="event.stopPropagation(); removeItemByIndex(${realIdx})" class="w-7 h-7 flex items-center justify-center rounded text-slate-400 hover:text-red-500 text-sm">✕</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderAll() {
            renderStaplesGrid();
            renderListDisplay();
        }

        async function syncWithCloud() {
            document.getElementById('status-text').innerText = 'Syncing...';
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                const data = await res.json();
                if (data.record) {
                    shoppingList = Array.isArray(data.record) ? data.record : (data.record.items || []);
                    localStorage.setItem('grocery_list', JSON.stringify(shoppingList));
                    updateTimestamp();
                    renderAll();
                    document.getElementById('status-text').innerText = 'Sync';
                }
            } catch (e) {
                document.getElementById('status-text').innerText = 'Err';
            }
        }

        async function autoPushCloud() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
                    body: JSON.stringify({ items: shoppingList })
                });
            } catch(e) {}
        }

        // Initial load
        renderAll();
        syncWithCloud();
    </script>
</body>
</html>
