<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Route Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-12">
    <header class="bg-emerald-700 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold">Aisle Route Shop</h1>
            <p id="status-text" class="text-xs text-emerald-100">Ready</p>
        </div>
        <button onclick="syncWithCloud()" class="bg-emerald-800 hover:bg-emerald-900 text-xs px-3 py-2 rounded-lg border border-emerald-600 font-semibold">
            🔄 Sync Now
        </button>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <!-- Search / Add Quick Bar -->
        <div class="bg-white p-3 rounded-xl shadow-sm flex gap-2">
            <input type="text" id="item-input" placeholder="Add custom item..." class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-600">
            <select id="cat-input" class="border rounded-lg px-2 py-2 text-xs bg-slate-50">
                <option value="Dairy">15. Dairy</option>
                <option value="Salad & Vegetables">1. Salad & Veg</option>
                <option value="Meat">12. Meat</option>
                <option value="Pantry">13. Pantry</option>
                <option value="Frozen">19. Frozen</option>
            </select>
            <button onclick="addItem()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-bold">+</button>
        </div>

        <!-- Staple Grid / List sorted by Route 1-19 -->
        <div id="shopping-list-container" class="space-y-3">
            <!-- Rendered via JS -->
        </div>
    </main>

    <script>
        // Exact 1-19 Route mapping
        const STORE_LAYOUT = {
            "Salad & Vegetables": 1, "Bananas": 2, "Health Foods": 3, "Berries": 4,
            "Fresh Produce": 5, "Fish & Seafood": 6, "Household": 7, "Drinks": 8,
            "Bakery": 9, "Snacks": 10, "Coffee & Sugar": 11, "Meat": 12,
            "Pantry": 13, "Grains": 14, "Dairy": 15, "Condiments": 16,
            "Juice": 17, "Cheese & Bacon": 18, "Frozen": 19
        };

        // Configured Credentials
        const JSONBIN_BIN_ID = "6aac2b8aac6210605ad971e4";
        const JSONBIN_API_KEY = "$2a$10$bmFEK.5E854LAjTQhAUaRe7wL1x9P9NEydEieXqkPP2LWKSGSo8qG";

        let items = JSON.parse(localStorage.getItem('grocery_list') || '[]');

        function saveLocal() {
            localStorage.setItem('grocery_list', JSON.stringify(items));
            renderList();
        }

        function addItem() {
            const input = document.getElementById('item-input');
            const cat = document.getElementById('cat-input').value;
            if (!input.value.trim()) return;
            items.push({ name: input.value.trim(), category: cat, qty: 1, checked: false });
            input.value = '';
            saveLocal();
            autoPushCloud();
        }

        function updateQty(index, delta) {
            items[index].qty += delta;
            if (items[index].qty <= 0) items.splice(index, 1);
            saveLocal();
            autoPushCloud();
        }

        function toggleCheck(index) {
            items[index].checked = !items[index].checked;
            saveLocal();
            autoPushCloud();
        }

        function getSortedItems() {
            return [...items].sort((a, b) => {
                const orderA = STORE_LAYOUT[a.category] ?? 99;
                const orderB = STORE_LAYOUT[b.category] ?? 99;
                return orderA - orderB;
            });
        }

        function renderList() {
            const container = document.getElementById('shopping-list-container');
            const sorted = getSortedItems();
            container.innerHTML = sorted.length === 0 
                ? '<div class="text-center text-slate-400 py-8 text-sm">List is empty</div>' 
                : sorted.map((item) => {
                    const realIdx = items.indexOf(item);
                    const routeNum = STORE_LAYOUT[item.category] || '??';
                    return `
                        <div class="bg-white p-3 rounded-xl shadow-sm flex items-center justify-between border-l-4 ${item.checked ? 'border-slate-300 opacity-60' : 'border-emerald-600'}">
                            <div class="flex items-center gap-3 flex-1" onclick="toggleCheck(${realIdx})">
                                <input type="checkbox" ${item.checked ? 'checked' : ''} class="w-5 h-5 accent-emerald-600 pointer-events-none">
                                <div>
                                    <div class="font-medium text-slate-800 ${item.checked ? 'line-through text-slate-400' : ''}">${item.name}</div>
                                    <div class="text-[11px] text-slate-400">Aisle Route #${routeNum} • ${item.category}</div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 bg-slate-50 rounded-lg p-1">
                                <button onclick="updateQty(${realIdx}, -1)" class="w-7 h-7 bg-white border rounded text-slate-600 font-bold">−</button>
                                <span class="text-sm font-semibold w-5 text-center">${item.qty}</span>
                                <button onclick="updateQty(${realIdx}, 1)" class="w-7 h-7 bg-white border rounded text-slate-600 font-bold">+</button>
                            </div>
                        </div>
                    `;
                }).join('');
        }

        async function syncWithCloud() {
            document.getElementById('status-text').innerText = 'Syncing...';
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                const data = await res.json();
                if (data.record) {
                    items = Array.isArray(data.record) ? data.record : (data.record.items || []);
                    saveLocal();
                    document.getElementById('status-text').innerText = 'Synced just now';
                }
            } catch (e) {
                document.getElementById('status-text').innerText = 'Offline/Sync error';
            }
        }

        async function autoPushCloud() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_API_KEY },
                    body: JSON.stringify({ items: items })
                });
            } catch(e) {}
        }

        // Initial fetch from cloud on load
        syncWithCloud();
    </script>
</body>
</html>
